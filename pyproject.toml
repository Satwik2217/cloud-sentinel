[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-sentinel"
version = "0.1.0"
description = "A real-world simulation for Cloud FinOps and Security auditing."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Satwik Mishra" }]
dependencies = [
    "fastapi>=0.104.0",
    "pydantic>=2.0.0",
    "uvicorn>=0.24.0",
    "requests>=2.25.0",
    "openai>=1.12.0",
    "openenv>=0.1.13"
]

# This defines the command 'server' to run your FastAPI app
[project.scripts]
server = "server.app:main"

[tool.setuptools]
# This ensures all modules in the server directory are included
packages = ["server"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.md"]